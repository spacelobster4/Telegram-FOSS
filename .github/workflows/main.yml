name: Build Telegram APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create API_KEYS file
        run: |
          echo "36170084" > API_KEYS
          echo "97dd15ccd7f4fbe1f8f814194f03aef9" >> API_KEYS

      - name: Build FOSS Debug APK
        run: bash ./gradlew assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Modified-APK
          path: TMessagesProj/build/outputs/apk/foss/debug/*.apk
