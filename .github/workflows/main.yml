name: Build Telegram APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm ninja-build

      - name: Setup exact NDK and Build C/C++ (FFmpeg)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.2.8568313"
          export NDK=$ANDROID_HOME/ndk/23.2.8568313
          export NINJA_PATH=$(which ninja)
          cd TMessagesProj/jni
          
          # Жестко вырезаем архитектуру эмуляторов (x86), чтобы скрипт даже не пытался ее собрать
          sed -i 's/"x86_64"//g' build_ffmpeg_clang.sh || true
          sed -i 's/"x86"//g' build_ffmpeg_clang.sh || true
          sed -i 's/x86_64//g' build_ffmpeg_clang.sh || true
          
          chmod +x *.sh
          if [ -f ./build_libvpx_clang.sh ]; then ./build_libvpx_clang.sh; fi
          if [ -f ./build_ffmpeg_clang.sh ]; then ./build_ffmpeg_clang.sh; fi
          if [ -f ./patch_ffmpeg.sh ]; then ./patch_ffmpeg.sh; fi
          if [ -f ./patch_boringssl.sh ]; then ./patch_boringssl.sh; fi
          if [ -f ./build_boringssl.sh ]; then ./build_boringssl.sh; fi

      - name: Inject API Keys directly to Gradle
        run: |
          sed -i 's/.*buildConfigField.*APP_ID.*/        buildConfigField "int", "APP_ID", "36170084"/' TMessagesProj/build.gradle
          sed -i 's/.*buildConfigField.*APP_HASH.*/        buildConfigField "String", "APP_HASH", "\\\"97dd15ccd7f4fbe1f8f814194f03aef9\\\""/' TMessagesProj/build.gradle
          echo "36170084" > API_KEYS
          echo "97dd15ccd7f4fbe1f8f814194f03aef9" >> API_KEYS

      - name: Build Debug APK
        run: |
          echo "ndk.dir=$ANDROID_HOME/ndk/23.2.8568313" > local.properties
          # Командуем Gradle собирать исключительно arm64
          bash ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Modified-APK
          path: '**/*.apk'
