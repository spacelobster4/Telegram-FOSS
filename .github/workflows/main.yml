name: Build Telegram APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm ninja-build

      - name: Setup exact NDK and Build C/C++ Libraries
        run: |
          # Скачиваем ровно ту версию, которую просит Telegram
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529"
          export NDK=$ANDROID_HOME/ndk/21.4.7075529
          export NINJA_PATH=$(which ninja)
          cd TMessagesProj/jni
          
          # Вырезаем x86
          sed -i 's/"x86_64"/"arm64-v8a"/g' *.sh || true
          sed -i 's/"x86"/"arm64-v8a"/g' *.sh || true
          
          chmod +x *.sh
          if [ -f ./build_libvpx_clang.sh ]; then ./build_libvpx_clang.sh arm64-v8a; fi
          if [ -f ./build_ffmpeg_clang.sh ]; then ./build_ffmpeg_clang.sh arm64-v8a; fi
          if [ -f ./patch_ffmpeg.sh ]; then ./patch_ffmpeg.sh; fi
          if [ -f ./patch_boringssl.sh ]; then ./patch_boringssl.sh; fi
          if [ -f ./build_boringssl.sh ]; then ./build_boringssl.sh arm64-v8a; fi

      - name: Inject API Keys directly to Gradle
        run: |
          sed -i 's/.*buildConfigField.*APP_ID.*/        buildConfigField "int", "APP_ID", "36170084"/' TMessagesProj/build.gradle
          sed -i 's/.*buildConfigField.*APP_HASH.*/        buildConfigField "String", "APP_HASH", "\\\"97dd15ccd7f4fbe1f8f814194f03aef9\\\""/' TMessagesProj/build.gradle
          echo "36170084" > API_KEYS
          echo "97dd15ccd7f4fbe1f8f814194f03aef9" >> API_KEYS

      - name: Build Debug APK
        run: |
          # Передаем правильный путь к нужной версии
          echo "ndk.dir=$ANDROID_HOME/ndk/21.4.7075529" > local.properties
          bash ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Modified-APK
          path: '**/*.apk'
